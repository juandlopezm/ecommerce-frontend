# Identificadores del proyecto (públicos; el scanner NO expande ${VARS} aquí).
# Solo SONAR_TOKEN es secreto (va en GitHub Actions secrets).
sonar.projectKey=juandlopezm_ecommerce-frontend
sonar.organization=juandlopezm
sonar.projectName=ecommerce-frontend
sonar.projectVersion=1.0

# Fuentes y pruebas
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclusiones de cobertura (archivos sin lógica de negocio)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/main.tsx,src/vite-env.d.ts

# Reporte de cobertura generado por Vitest + @vitest/coverage-v8 (formato lcov)
# Comando: npm run test:coverage  →  coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
