server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Oculta la versión de nginx en la cabecera Server (ZAP 10036).
    server_tokens off;

    # Cabeceras de seguridad seguras para una SPA (se heredan en la location).
    # NOTA: CSP y COEP NO se fijan aquí porque dependen del entorno (connect-src debe
    # permitir el origen del API; COEP rompe recursos cross-origin) — se diseñan aparte.
    add_header X-Frame-Options "SAMEORIGIN" always;            # ZAP 10020
    add_header X-Content-Type-Options "nosniff" always;        # ZAP 10021
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always; # ZAP 10063

    # SPA: cualquier ruta del cliente (/producto/:id, /admin, /carrito…) sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
