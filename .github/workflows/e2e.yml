name: E2E (Playwright)

# Las E2E son lentas y levantan un entorno completo, así que NO corren en cada push de feature:
# solo en Pull Requests hacia develop/main, en main, y de forma manual.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  e2e:
    name: E2E en entorno efímero
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del frontend
        uses: actions/checkout@v4

      - name: Arrancar backend (imagen Docker de GHCR)
        run: |
          docker run -d --name backend -p 8000:8000 \
            ghcr.io/juandlopezm/ecommerce-backend:latest \
            sh -c "alembic upgrade head && python -m app.seed && python -m app.seed_products && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          echo "Esperando el backend..."
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Construir y servir el frontend
        env:
          VITE_API_URL: "http://localhost:8000/api/v1"
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 5173 > front.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ && break; sleep 1; done

      - name: Instalar Playwright + navegador
        working-directory: e2e
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: "http://localhost:5173"
        run: pytest --junitxml=report.xml --tracing=retain-on-failure

      - name: Publicar resultados (tests aprobados/fallidos)
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados E2E
          path: e2e/report.xml
          reporter: java-junit

      - name: Subir reporte y trazas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/report.xml
            e2e/test-results/
          retention-days: 7

      - name: Logs del backend (si falla)
        if: failure()
        run: docker logs backend || true
