name: CI Frontend

# Estrategia por capas:
#  - lint (typecheck + build) + unitarias → en CADA push.
#  - cobertura con gate ≥70 %            → solo en PR/push a develop/main.
#  - sonarcloud                           → tras test exitoso en develop/main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Lint y build ─────────────────────────────────────────────────────────
  lint:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck + build (tsc + vite)
        run: npm run build

  # ─── 2. Pruebas unitarias (todos los pushes) ─────────────────────────────────
  unit:
    name: Pruebas unitarias (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vitest (sin gate de cobertura)
        run: npm run test

  # ─── 3. Cobertura con gate ≥70 % ─────────────────────────────────────────────
  coverage:
    name: Cobertura (≥70 %)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vitest + cobertura (gate ≥70 %)
        run: npm run test:coverage
      - name: Subir reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/
          retention-days: 7

  # ─── 4. SonarCloud ────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [coverage]
    if: >-
      always() &&
      needs.coverage.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar reportes de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/
        continue-on-error: true
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
