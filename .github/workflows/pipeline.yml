name: Pipeline Frontend

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline ÚNICO: ejecuta TODAS las fases en una sola corrida sin importar la
# rama. Despliegue a producción solo desde main. Resultados acumulativos en
# el dashboard.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: pipeline-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write

jobs:
  # ═══ 1. Lint y build (typecheck) ═════════════════════════════════════════════
  lint:
    name: Lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        run: npm run build

  # ═══ 2. Auditoría de dependencias (SAST) ═════════════════════════════════════
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Auditar dependencias (informativo)
        run: npm audit --audit-level=high || true

  # ═══ 3. Unit/componente + cobertura (gate ≥70%) ═════════════════════════════
  test:
    name: Pruebas + cobertura (≥70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Vitest run --coverage
        run: npm run test:coverage
      - uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados unitarias
          path: reports/junit-unit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            reports/junit-unit.xml
            coverage/
          retention-days: 7

  # ═══ 4. SonarCloud ══════════════════════════════════════════════════════════
  sonarcloud:
    name: SonarCloud
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .
        continue-on-error: true
      - uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

  # ═══ 5a. E2E (pytest-playwright contra preprod) ═════════════════════════════
  cd-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Login a GHCR (imagen backend)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar preprod (postgres + backend GHCR + frontend Nginx)
        continue-on-error: true
        run: |
          docker compose -f docker-compose.preprod.yml up --build -d
          for i in $(seq 1 40); do
            back=$(curl -sf http://localhost:8000/health >/dev/null && echo ok || echo no)
            front=$(curl -sf http://localhost:8080 >/dev/null && echo ok || echo no)
            if [ "$back" = "ok" ] && [ "$front" = "ok" ]; then echo "stack listo"; break; fi
            echo "esperando stack ($i) back=$back front=$front..."; sleep 3
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8080 >/dev/null
      - name: E2E (Playwright)
        continue-on-error: true
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin@ecommerce.com
          E2E_ADMIN_PASSWORD: Admin123!
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p reports
          pytest e2e/tests \
            -c e2e/pytest.ini \
            --junitxml=reports/junit-e2e.xml \
            --tracing=retain-on-failure
      - name: Apagar preprod
        if: always()
        run: docker compose -f docker-compose.preprod.yml down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-e2e
          path: |
            reports/
            e2e/test-results/
          retention-days: 7

  # ═══ 5b. DAST (OWASP ZAP contra el frontend) ════════════════════════════════
  cd-dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login a GHCR (imagen backend)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar preprod (postgres + backend GHCR + frontend Nginx)
        continue-on-error: true
        run: |
          docker compose -f docker-compose.preprod.yml up --build -d
          for i in $(seq 1 40); do
            front=$(curl -sf http://localhost:8080 >/dev/null && echo ok || echo no)
            if [ "$front" = "ok" ]; then echo "frontend listo"; break; fi
            echo "esperando frontend ($i)..."; sleep 3
          done
          curl -sf http://localhost:8080 >/dev/null
      - name: OWASP ZAP (DAST)
        uses: zaproxy/action-baseline@master
        continue-on-error: true
        with:
          target: http://172.17.0.1:8080
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          token: ${{ secrets.GITHUB_TOKEN }}
          cmd_options: "-a"
      - name: Apagar preprod
        if: always()
        run: docker compose -f docker-compose.preprod.yml down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-dast
          path: |
            report_json.json
            report_html.html
            report_md.md
          retention-days: 7

  # ═══ 6. DEPLOY · Build de producción + publicar imagen GHCR (solo main) ═════
  deploy-front:
    name: Build prod + publicar imagen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ═══ 7. Dashboard acumulativo ═══════════════════════════════════════════════
  dashboard:
    name: Dashboard de resultados
    needs: [lint, audit, test, sonarcloud, cd-e2e, cd-dast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dashboard-artifacts
        continue-on-error: true
      - name: Construir dashboard
        env:
          PIPELINE_FLOW: full
        run: |
          mkdir -p dashboard
          python ci/build_dashboard.py \
            --input dashboard-artifacts \
            --html-out dashboard/index.html \
            --md-out dashboard/summary.md
          cat dashboard/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-html
          path: dashboard
          retention-days: 30
      - name: Preparar artefacto de Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  # ═══ 8. Publicar dashboard en GitHub Pages ═══════════════════════════════════
  publish-pages:
    name: Publicar dashboard (Pages)
    needs: dashboard
    if: ${{ always() && needs.dashboard.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
